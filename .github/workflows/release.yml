name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0)"
        required: false
        default: "v1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 is not set; building debug APK only."
          fi

      - name: Build debug and signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Verify release signature
        if: steps.keystore.outputs.has_keystore == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          for APK in app/build/outputs/apk/release/app-release.apk; do
            echo "Verifying $APK"
            "$APKSIGNER" verify --print-certs "$APK"
          done

      - name: Prepare release files
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          rm -rf artifacts
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/RainManager-${TAG}-debug.apk"
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "artifacts/RainManager-${TAG}-release.apk"
          fi
          PREVIOUS=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREVIOUS" ]; then RANGE="${PREVIOUS}..HEAD"; else RANGE="HEAD"; fi
          NOTES="release-notes/${TAG#v}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-notes.md
          else
            {
              echo "## Changes"
              git log --pretty=format:'- %s (`%h`)' -n 10 "$RANGE"
            } > release-notes.md
          fi
          {
            echo
            echo
            echo "## Downloads"
            if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
              echo "- \`RainManager-${TAG}-release.apk\`: signed release build"
            fi
            echo "- \`RainManager-${TAG}-debug.apk\`: debug build"
          } >> release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Rain Manager ${TAG}" --notes-file release-notes.md
            gh release upload "$TAG" artifacts/*.apk --clobber
          else
            gh release create "$TAG" \
              artifacts/*.apk \
              --title "Rain Manager ${TAG}" \
              --notes-file release-notes.md
          fi

      - name: Check LSPosed module repository token
        id: module_repo
        env:
          MODULE_REPO_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
        run: |
          if [ -n "$MODULE_REPO_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MODULE_REPO_TOKEN is not set; skipping the LSPosed module repository release."
          fi

      - name: Publish to LSPosed module repository
        if: steps.module_repo.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          MODULE_TAG="${VERSION_CODE}-${VERSION_NAME}"
          REPO="Xposed-Modules-Repo/io.github.rushiranpise.modulesmanager"
          ASSET="artifacts/ModulesManager-${MODULE_TAG}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"

          NOTES="release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" module-release-notes.md
          else
            cp release-notes.md module-release-notes.md
          fi
          {
            echo
            echo
            echo "## Download"
            echo
            echo "- \`ModulesManager-${MODULE_TAG}-release.apk\`: signed release build"
          } >> module-release-notes.md

          if gh release view "$MODULE_TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$MODULE_TAG" -R "$REPO" \
              --title "Modules Manager ${VERSION_NAME}" \
              --notes-file module-release-notes.md
            gh release upload "$MODULE_TAG" "$ASSET" -R "$REPO" --clobber
          else
            gh release create "$MODULE_TAG" "$ASSET" -R "$REPO" \
              --title "Modules Manager ${VERSION_NAME}" \
              --notes-file module-release-notes.md
          fi
